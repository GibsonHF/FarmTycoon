name: CropPlugin
version: '1.0-SNAPSHOT'
main: me.gibson.cropPlugin.FarmTycoonPlugin
api-version: '1.21'
depend: ["NBTAPI"]
softdepend: ["PlaceholderAPI"]
commands:
  farmgui:
    description: Open the crop selection GUI.
    usage: /farmgui
  minegui:
    description: Open the mine selection GUI.
    usage: /minegui
  prestige:
    description: Prestige to the next level.
    usage: /prestige
  condense:
    description: Condense crops into higher levels.
    usage: /condense
    permission: farmtycoon.condense
  sell:
    description: Sell crops in your inventory.
    usage: /sell
  gems:
    description: Manage player gems
    usage: /gems <add|set|pay> <player> <amount>
  ggwave:
    description: Send a message to all players.
    usage: /ggwave <player>
    permission: farmtycoon.admin
    permission-message: You do not have permission to use this command.
  setprestige:
    description: Set a player's prestige level
    usage: /setprestige <player> <level>
    permission: cropPlugin.setprestige
  replacecrops:
    description: Replace all crops above farmland with the specified crop at max age.
    usage: /replacecrops <crop>
    permission: farmtycoon.replacecrops
permissions:
  farmtycoon.admin:
    description: Permission to manage player prestige levels.
    default: op